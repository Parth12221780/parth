<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Result History — Number Results Portal</title>
<meta name="description" content="Browse historical number results by date, month, year and game.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header"><div class="wrap nav"><a class="brand" href="/">NUMBER<span>RESULTS</span></a><nav><a href="/">Home</a><a class="active" href="/history.html">History</a><a href="/about.html">About</a><a href="/disclaimer.html">Disclaimer</a></nav></div></header>
<main class="wrap page">
  <p class="eyebrow">ARCHIVE</p><h1>Result History</h1><p class="page-intro">Browse the complete stored history. New daily entries are automatically arranged by date after an admin update.</p>
  <div class="filters">
    <label>Year<select id="year"></select></label>
    <label>Month<select id="month"><option value="">All months</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></label>
    <label>Game<select id="game"><option value="">All games</option></select></label>
    <button class="button" id="apply">Show results</button>
  </div>
  <div id="history" class="history-box">Loading history…</div>
</main>
<footer class="footer"><div class="wrap footer-inner"><span>© <span id="footYear"></span> Number Results Portal</span><span><a href="/about.html">About & Contact</a> · <a href="/disclaimer.html">Disclaimer & Privacy</a></span></div></footer>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
async function init(){
 const data=await (await fetch('/api/results/today')).json();
 const y=document.getElementById('year'); const now=new Date().getFullYear();
 for(let i=now;i>=now-5;i--) y.insertAdjacentHTML('beforeend',`<option value="${i}">${i}</option>`);
 data.games.forEach(g=>document.getElementById('game').insertAdjacentHTML('beforeend',`<option value="${esc(g.slug)}">${esc(g.name)}</option>`));
 y.value=now; document.getElementById('footYear').textContent=now; load();
}
async function load(){
 const q=new URLSearchParams({year:document.getElementById('year').value});
 if(document.getElementById('month').value) q.set('month',document.getElementById('month').value);
 if(document.getElementById('game').value) q.set('game',document.getElementById('game').value);
 const data=await (await fetch('/api/results/history?'+q)).json();
 if(!data.results.length){document.getElementById('history').innerHTML='<div class="empty">No results found for the selected filters.</div>';return;}
 const grouped={}; data.results.forEach(r=>(grouped[r.result_date]??=[]).push(r));
 document.getElementById('history').innerHTML=Object.entries(grouped).map(([date,rows])=>`<div class="history-day"><div class="history-date">${fmt(date)}</div><div class="history-items">${rows.map(r=>`<div class="history-item"><span>${esc(r.name)}</span><strong>${esc(r.result_value)}</strong><small>${esc(r.result_time||'')}</small></div>`).join('')}</div></div>`).join('');
}
document.getElementById('apply').onclick=load; init().catch(()=>document.getElementById('history').innerHTML='<div class="error">History could not be loaded.</div>');
</script>
</body>
</html>
