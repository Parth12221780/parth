<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Results</title><meta name="description" content="Informational number results and result history."><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><div class="brand">NUMBER <span>RESULTS</span></div><a href="#history">History</a></div></header><main class="wrap"><section class="hero"><p class="eyebrow">INFORMATIONAL RESULTS</p><h1>Today's Results</h1><p class="muted">Numbers and published result history in one clean dashboard.</p></section><section id="today" class="grid"><div class="loading">Loading results…</div></section><section id="history" class="history"><div class="section-head"><div><p class="eyebrow">ARCHIVE</p><h2>Result History</h2></div><div class="filters"><select id="year"></select><select id="month"></select><button onclick="loadHistory()">View</button></div></div><div id="historyTable"></div></section></main><footer><div class="wrap">Informational number-results portal</div></footer><script>
const API=window.__HATCHABLE__.api;
const names=["January","February","March","April","May","June","July","August","September","October","November","December"];
year.innerHTML=Array.from({length:5},(_,i)=>'<option>'+(2026-i)+'</option>').join("");
month.innerHTML=names.map((n,i)=>'<option value="'+(i+1)+'">'+n+'</option>').join(""); month.value=10;
async function loadToday(){const d=await fetch(API+"/results/today").then(r=>r.json());today.innerHTML=d.results.map(x=>'<article class="card"><div class="cardtop"><span>'+x.name+'</span><span>'+x.result_time+'</span></div><div class="number">'+(x.result_value||"—")+'</div><div class="date">'+x.result_date+'</div></article>').join("")}
async function loadHistory(){const d=await fetch(API+"/results/history?year="+year.value+"&month="+month.value).then(r=>r.json()); if(!d.results.length){historyTable.innerHTML='<p class="muted empty">No published results for this period.</p>';return} const by={}; d.results.forEach(x=>(by[x.result_date]??=[]).push(x)); historyTable.innerHTML='<div class="tablewrap"><table><thead><tr><th>Date</th><th>Game</th><th>Result</th></tr></thead><tbody>'+Object.entries(by).flatMap(([date,items])=>items.map(x=>'<tr><td>'+date+'</td><td>'+x.name+'</td><td><strong>'+x.result_value+'</strong></td></tr>')).join("")+'</tbody></table></div>'}
loadToday();loadHistory();
</script></body></html>
