<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Number Results</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><div class="brand">RESULT <span>ADMIN</span></div><a href="/">Public Site</a></div></header><main class="wrap admin"><section class="hero"><p class="eyebrow">OWNER PANEL</p><h1>Publish a Result</h1><p class="muted">Only the project owner can access this management route.</p></section><form id="form" class="panel"><label>Game<select id="game"></select></label><label>Date<input id="date" type="date" required></label><label>Result<input id="value" inputmode="numeric" maxlength="20" required placeholder="Enter result"></label><button>Save Result</button><p id="msg"></p></form></main><script>
const API=window.__HATCHABLE__.api; const game=document.getElementById("game"),date=document.getElementById("date"),value=document.getElementById("value"),msg=document.getElementById("msg"); date.value=new Date().toISOString().slice(0,10);
async function init(){const r=await fetch(API+"/admin/games");if(!r.ok){msg.textContent="Admin access required.";return}const games=await r.json();game.innerHTML=games.map(g=>'<option value="'+g.id+'">'+g.name+'</option>').join("")}
form.onsubmit=async e=>{e.preventDefault();msg.textContent="Saving…";const r=await fetch(API+"/admin/results",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({game_id:game.value,result_date:date.value,result_value:value.value})});const d=await r.json();msg.textContent=r.ok?"Saved successfully.":"Error: "+(d.error||"Unable to save");if(r.ok)value.value=""};init();
</script></body></html>
